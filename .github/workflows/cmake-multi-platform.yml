# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install dependencies (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwayland-dev \
          libxkbcommon-dev \
          xorg-dev

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aloha-${{ matrix.os}}-${{ matrix.c_compiler }}-${{ matrix.build_type }}
        path: |
          ${{ steps.strings.outputs.build-output-dir }}/Aloha

  release:
    if: github.ref_type == 'tag'

    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/checkout@v4

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          shopt -s nullglob
          artifact_dirs=(artifacts/*/)
          shopt -u nullglob

          if [ ${#artifact_dirs[@]} -eq 0 ]; then
            echo "::error::No artifact directories found under artifacts/"
            exit 1
          fi

          for artifact_path in "${artifact_dirs[@]}"; do
            artifact_dir="${artifact_path%/}"
            name=$(basename "$artifact_dir")

            # Skip empty artifact dirs instead of silently zipping nothing
            if [ -z "$(find "$artifact_dir" -type f -print -quit)" ]; then
              echo "::warning::Artifact '$name' is empty, skipping"
              continue
            fi

            tmpdir=$(mktemp -d)
            trap 'rm -rf "$tmpdir"' EXIT

            cp README.md "$tmpdir/"
            cp LICENSE "$tmpdir/"
            cp -r assets "$tmpdir/assets"

            mkdir -p "$tmpdir/$name"
            cp -r "$artifact_dir"/. "$tmpdir/$name/"

            # Ensure the binary is executable regardless of platform/naming
            find "$tmpdir/$name" -maxdepth 1 -type f \( -name 'Aloha' -o -name 'Aloha.exe' \) -exec chmod +x {} \;

            zip_path="${GITHUB_WORKSPACE}/release/${name}.zip"
            (cd "$tmpdir" && zip -r "$zip_path" .)

            rm -rf "$tmpdir"
            trap - EXIT

            if [ ! -f "$zip_path" ]; then
              echo "::error::Failed to create $zip_path"
              exit 1
            fi
          done

          echo "Release archives:"
          ls -la release
          find release -maxdepth 1 -type f | sort

          if [ -z "$(find release -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::No zip files were produced in release/"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}

            Artifacts are packaged per platform, compiler, build type and linkage mode.
          files: release/*.zip
          prerelease: false