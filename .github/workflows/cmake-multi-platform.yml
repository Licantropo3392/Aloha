# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Build with GCC/Clang on Linux and MSVC/MinGW-w64 UCRT64 on Windows.
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            shell: bash
            generator_args: ""
            build_type: "Release"
            msys2: false
          - name: linux-clang
            os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            shell: bash
            generator_args: ""
            build_type: "Release"
            msys2: false
          - name: windows-msvc
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            shell: pwsh
            generator_args: ""
            build_type: "Release"
            msys2: false
          - name: windows-mingw-ucrt64
            os: windows-latest
            c_compiler: gcc
            cpp_compiler: g++
            shell: 'msys2 {0}'
            generator_args: -G Ninja
            build_type: "Release"
            msys2: true
            msystem: UCRT64

    steps:
    - uses: actions/checkout@v4

    - name: Cache build directory
      uses: actions/cache@v4
      with:
        path: build
        key: aloha-build-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ github.ref }}-${{ github.run_id }}
        restore-keys: |
          aloha-build-${{ runner.os }}-${{ matrix.name }}-${{ matrix.build_type }}-${{ github.ref }}-

    - name: Set up MSYS2 UCRT64
      if: matrix.msys2 == true
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        update: true
        cache: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja

    - name: Install dependencies (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwayland-dev \
          libxkbcommon-dev \
          xorg-dev

    - name: Configure CMake
      shell: ${{ matrix.shell }}
      run: >
        cmake -S . -B build
        ${{ matrix.generator_args }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      shell: ${{ matrix.shell }}
      run: cmake --build build --config Release

    - name: Stage release files
      shell: bash
      run: |
        set -euo pipefail
        candidates=(
          build/Aloha
          build/Aloha.exe
          build/Release/Aloha
          build/Release/Aloha.exe
          dist/pc/Aloha
          dist/pc/Aloha.exe
        )
        binary=""
        for candidate in "${candidates[@]}"; do
          if [[ -f "$candidate" ]]; then
            binary="$candidate"
            break
          fi
        done
        if [[ -z "$binary" ]]; then
          echo "::error::Could not find Aloha executable. Checked: ${candidates[*]}"
          exit 1
        fi
        mkdir -p staging
        cp "$binary" staging/
        cp -r README.md LICENSE assets staging/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aloha-${{ matrix.name }}
        path: staging/
        if-no-files-found: error
        retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          shopt -s nullglob
          artifact_dirs=(artifacts/*/)
          shopt -u nullglob

          if [ ${#artifact_dirs[@]} -eq 0 ]; then
            echo "::error::No artifact directories found under artifacts/"
            exit 1
          fi

          for artifact_path in "${artifact_dirs[@]}"; do
            artifact_dir="${artifact_path%/}"
            name=$(basename "$artifact_dir")

            if [ -z "$(find "$artifact_dir" -type f -print -quit)" ]; then
              echo "::warning::Artifact '$name' is empty, skipping"
              continue
            fi

            tmpdir=$(mktemp -d)
            trap 'rm -rf "$tmpdir"' EXIT

            # Artifacts already contain the executable and matching assets.
            cp -r "$artifact_dir"/. "$tmpdir/"

            for required_file in README.md LICENSE assets/awesomeface.png; do
              if [ ! -s "$tmpdir/$required_file" ]; then
                echo "::error::Artifact '$name' is missing $required_file"
                exit 1
              fi
            done

            if [ ! -s "$tmpdir/Aloha" ] && [ ! -s "$tmpdir/Aloha.exe" ]; then
              echo "::error::Artifact '$name' does not contain an Aloha executable"
              exit 1
            fi

            find "$tmpdir" -maxdepth 1 -type f \( -name 'Aloha' -o -name 'Aloha.exe' \) -exec chmod +x {} \;

            zip_path="${GITHUB_WORKSPACE}/release/${name}.zip"
            (cd "$tmpdir" && zip -r "$zip_path" .)

            if [ ! -f "$zip_path" ]; then
              echo "::error::Failed to create $zip_path"
              exit 1
            fi
            unzip -tq "$zip_path"
            unzip -Z1 "$zip_path" | grep -Fxq "README.md"
            unzip -Z1 "$zip_path" | grep -Fxq "LICENSE"
            unzip -Z1 "$zip_path" | grep -Fxq "assets/awesomeface.png"
            rm -rf "$tmpdir"
            trap - EXIT
          done

          echo "Release archives:"
          ls -la release
          find release -maxdepth 1 -type f | sort

          if [ -z "$(find release -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::No zip files were produced in release/"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}

            Artifacts are packaged per platform, compiler, build type and linkage mode.
          files: release/*.zip
          fail_on_unmatched_files: true
          prerelease: false